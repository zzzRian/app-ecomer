{% extends "base.html" %}
{% block title %}Crear cuenta{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow"><div class="card-body p-4">
      <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Crear cuenta</h3>
      <form method="post" class="row g-3">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" required></div>
        <div class="col-md-6"><label class="form-label">Apellido</label><input class="form-control" name="apellido"></div>
        <div class="col-12"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
        <div class="col-md-6"><label class="form-label">Teléfono</label><input class="form-control" name="telefono"></div>
        <div class="col-md-6"><label class="form-label">Contraseña</label><input type="password" class="form-control" name="password" required minlength="6"></div>
        <div class="col-12"><button class="btn btn-primary w-100">Crear cuenta</button></div>
      </form>
      <p class="text-center mt-3 mb-0">¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a></p>
    </div></div>
  </div>
</div>
{% endblock %}
