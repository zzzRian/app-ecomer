{% extends "base.html" %}
{% block title %}Contacto{% endblock %}
{% block content %}
<h1>Contacto</h1>
<form method="post" class="row g-3" style="max-width:600px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="col-md-6"><label class="form-label">Nombre</label><input class="form-control" name="nombre" required></div>
  <div class="col-md-6"><label class="form-label">Email</label><input type="email" class="form-control" name="email" required></div>
  <div class="col-12"><label class="form-label">Mensaje</label><textarea class="form-control" name="mensaje" rows="5" required></textarea></div>
  <div class="col-12"><button class="btn btn-primary">Enviar</button></div>
</form>
{% endblock %}
