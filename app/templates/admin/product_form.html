{% extends "admin/_layout.html" %}
{% block title %}{{ 'Editar' if producto else 'Nuevo' }} producto{% endblock %}
{% block content %}
<h2>{{ 'Editar' if producto else 'Nuevo' }} producto</h2>
<form method="post" enctype="multipart/form-data" class="card p-4 bg-white">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="row g-3">
    <div class="col-md-8"><label class="form-label">Nombre *</label><input class="form-control" name="nombre" value="{{ producto.nombre if producto else '' }}" required></div>
    <div class="col-md-4"><label class="form-label">SKU</label><input class="form-control" name="sku" value="{{ producto.sku if producto else '' }}"></div>
    <div class="col-12"><label class="form-label">Descripción</label><textarea class="form-control" name="descripcion" rows="3">{{ producto.descripcion if producto else '' }}</textarea></div>
    <div class="col-12"><label class="form-label">Especificaciones</label><textarea class="form-control" name="especificaciones" rows="3">{{ producto.especificaciones if producto else '' }}</textarea></div>
    <div class="col-md-3"><label class="form-label">Precio *</label><input type="number" step="0.01" class="form-control" name="precio" value="{{ producto.precio if producto else '' }}" required></div>
    <div class="col-md-3"><label class="form-label">Precio oferta</label><input type="number" step="0.01" class="form-control" name="precio_oferta" value="{{ producto.precio_oferta if producto and producto.precio_oferta else '' }}"></div>
    <div class="col-md-3"><label class="form-label">Stock</label><input type="number" class="form-control" name="stock" value="{{ producto.stock if producto else 0 }}"></div>
    <div class="col-md-3"><label class="form-label">Stock mínimo</label><input type="number" class="form-control" name="stock_minimo" value="{{ producto.stock_minimo if producto else 5 }}"></div>
    <div class="col-md-6"><label class="form-label">Categoría</label>
      <select class="form-select" name="categoria_id">
        <option value="">—</option>
        {% for c in categorias %}<option value="{{ c.id }}" {% if producto and producto.categoria_id==c.id %}selected{% endif %}>{{ c.nombre }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Marca</label>
      <select class="form-select" name="marca_id">
        <option value="">—</option>
        {% for m in marcas %}<option value="{{ m.id }}" {% if producto and producto.marca_id==m.id %}selected{% endif %}>{{ m.nombre }}</option>{% endfor %}
      </select>
    </div>
    <div class="col-md-6"><label class="form-label">Imagen</label><input type="file" class="form-control" name="imagen" accept="image/*"></div>
    <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="destacado" id="d" {% if producto and producto.destacado %}checked{% endif %}><label class="form-check-label" for="d">Destacado</label></div></div>
    <div class="col-md-3 d-flex align-items-end"><div class="form-check"><input class="form-check-input" type="checkbox" name="activo" id="a" {% if not producto or producto.activo %}checked{% endif %}><label class="form-check-label" for="a">Activo</label></div></div>
  </div>
  <div class="mt-4">
    <button class="btn btn-primary"><i class="bi bi-save"></i> Guardar</button>
    <a href="{{ url_for('admin.products_list') }}" class="btn btn-outline-secondary">Cancelar</a>
  </div>
</form>
{% endblock %}
